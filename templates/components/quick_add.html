{% load static %}
<script src="{% static 'js/nl-parse.js' %}"></script>
<div x-data="quickAddModal()" @open-quick-add.window="onOpen($event)" x-cloak>
  <!-- Backdrop + Centering wrapper -->
  <div x-show="open" x-transition:enter="transition-opacity duration-200"
       x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition-opacity duration-150"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       @click="open = false"
       class="fixed inset-0 z-50 flex items-end justify-center bg-earth-900/50 dark:bg-earth-950/70
              lg:items-center">

    <!-- Bottom sheet / Modal -->
    <div x-show="open" x-cloak
         x-transition:enter="transition-all duration-300 ease-out"
         x-transition:enter-start="opacity-0 translate-y-8" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition-all duration-200 ease-in"
         x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-8"
         @click.stop
         class="w-full max-h-[85vh] overflow-y-auto rounded-t-2xl bg-white shadow-2xl dark:bg-earth-900
                lg:max-w-md lg:rounded-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between border-b border-earth-200 px-5 py-4 dark:border-earth-800">
      <h2 class="text-base font-semibold text-earth-900 dark:text-earth-100">Agregar rapido</h2>
      <button @click="open = false" class="rounded-lg p-1.5 text-earth-400 hover:bg-earth-100 hover:text-earth-600 dark:hover:bg-earth-800 dark:hover:text-earth-300 touch-target" aria-label="Cerrar">
        <i data-lucide="x" class="lucide-sm"></i>
      </button>
    </div>

    <!-- Dictado / lenguaje natural (plegable) -->
    <div class="border-b border-earth-200 dark:border-earth-800">
      <button type="button" @click="nlOpen = !nlOpen"
              class="flex w-full items-center justify-between gap-2 px-5 py-3 text-sm font-medium text-earth-700 dark:text-earth-300 touch-target"
              :aria-expanded="nlOpen">
        <span class="flex items-center gap-2">
          <i data-lucide="sparkles" class="lucide-sm text-clay-500"></i>
          Dictá o escribí
        </span>
        <span class="inline-flex transition-transform" :class="nlOpen ? 'rotate-180' : ''">
          <i data-lucide="chevron-down" class="lucide-sm text-earth-400"></i>
        </span>
      </button>
      <div x-show="nlOpen" x-cloak x-transition class="px-5 pb-4">
        <div class="relative">
          <textarea x-model="nlText" @input.debounce.500ms="applyNl()" rows="2"
                    placeholder="Ej: hoy gasté 6000 en el bar"
                    class="w-full rounded-lg border border-earth-300 bg-white px-3 py-2.5 pr-12 text-sm text-earth-900 placeholder-earth-400 focus:border-clay-400 focus:outline-none focus:ring-2 focus:ring-clay-400/20 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-200 dark:placeholder-earth-500"></textarea>
          <button type="button" @click="toggleListen()"
                  :class="listening ? 'bg-clay-500 text-white animate-pulse' : 'bg-clay-50 text-clay-600 hover:bg-clay-100 dark:bg-clay-900/30 dark:text-clay-300'"
                  class="absolute right-2 top-2 flex h-9 w-9 items-center justify-center rounded-lg touch-target"
                  :aria-label="listening ? 'Detener dictado' : 'Dictar'" title="Dictar (pide permiso de micrófono)">
            <i data-lucide="mic" class="lucide-sm"></i>
          </button>
        </div>
        <p x-show="micError" x-text="micError" class="mt-1.5 text-xs text-clay-600 dark:text-clay-400"></p>
        <p x-show="micStatus && !micError" x-text="micStatus" class="mt-1.5 text-xs text-sage-600 dark:text-sage-400"></p>
        <p x-show="!speechSupported && !micError && !micStatus" class="mt-1.5 text-xs text-earth-400 dark:text-earth-500">Este navegador no soporta dictado nativo; usá el micrófono del teclado.</p>
      </div>
    </div>

    <!-- Form -->
    <form hx-post="{% url 'finances:transaction_quick_add' %}"
          hx-swap="none"
          @htmx:before-request="submitting = true"
          @htmx:after-request="handleResponse($event)"
          class="space-y-4 p-5">
      {% csrf_token %}

      <!-- Type toggle -->
      <div class="flex gap-2" role="radiogroup" aria-label="Tipo de transacción">
        <button type="button" @click="type = 'EXPENSE'; $dispatch('quick-type-change', 'EXPENSE')"
                class="flex-1 rounded-lg border-2 px-4 py-2.5 text-sm font-medium transition-all touch-target"
                role="radio" :aria-checked="type === 'EXPENSE'"
                :class="type === 'EXPENSE'
                  ? 'border-clay-400 bg-clay-50 text-clay-700 dark:border-clay-500 dark:bg-clay-900/30 dark:text-clay-300'
                  : 'border-earth-200 bg-white text-earth-500 hover:bg-earth-50 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-400 dark:hover:bg-earth-700'">
          <i data-lucide="trending-down" class="lucide-sm inline-block align-middle"></i>
          <span class="align-middle">Gasto</span>
        </button>
        <button type="button" @click="type = 'INCOME'; $dispatch('quick-type-change', 'INCOME')"
                class="flex-1 rounded-lg border-2 px-4 py-2.5 text-sm font-medium transition-all touch-target"
                role="radio" :aria-checked="type === 'INCOME'"
                :class="type === 'INCOME'
                  ? 'border-sage-400 bg-sage-50 text-sage-700 dark:border-sage-500 dark:bg-sage-900/30 dark:text-sage-300'
                  : 'border-earth-200 bg-white text-earth-500 hover:bg-earth-50 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-400 dark:hover:bg-earth-700'">
          <i data-lucide="trending-up" class="lucide-sm inline-block align-middle"></i>
          <span class="align-middle">Ingreso</span>
        </button>
      </div>
      <input type="hidden" name="type" :value="type">

      <!-- Amount -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-earth-700 dark:text-earth-300">Monto</label>
        <div class="relative">
          <input type="number" name="amount" step="0.01" required placeholder="0.00"
                 x-model="amount" inputmode="decimal" autocomplete="off" enterkeyhint="done"
                 class="w-full rounded-lg border border-earth-300 bg-white px-4 py-3 pr-14 text-base text-earth-900 placeholder-earth-400 focus:border-clay-400 focus:outline-none focus:ring-2 focus:ring-clay-400/20 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-200 dark:placeholder-earth-500 sm:text-sm sm:py-2.5">
          {% if request.colony.default_currency %}
          <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-earth-400 dark:text-earth-500">{{ request.colony.default_currency.symbol }} {{ request.colony.default_currency.code }}</span>
          {% endif %}
        </div>
      </div>

      <!-- Category -->
      <div id="quick-category-field" x-data="quickCategoryDropdown()" x-init="loadCategories()" @quick-type-change.window="type = $event.detail; loadCategories($event.detail)">
        <label class="mb-1.5 block text-sm font-medium text-earth-700 dark:text-earth-300">Categoria</label>
        <div class="relative" @click.outside="open = false">
          <button type="button" @click="toggle(); $nextTick(() => positionDropdown($refs.dropdownBtn))"
                  x-ref="dropdownBtn"
                  class="flex w-full items-center gap-2 rounded-lg border border-earth-300 bg-white px-4 py-2.5 text-sm text-earth-900 focus:border-clay-400 focus:outline-none focus:ring-2 focus:ring-clay-400/20 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-200">
            <template x-if="selectedIcon">
              <i :data-lucide="selectedIcon" class="lucide-sm"></i>
            </template>
            <span x-text="selectedName" class="flex-1 text-left"></span>
            <i data-lucide="chevron-down" class="lucide-sm text-earth-400"></i>
          </button>
          <div x-show="open" x-transition x-ref="dropdownList"
               :style="dropdownStyle"
               class="fixed z-[60] max-h-60 w-full overflow-auto rounded-lg border border-earth-200 bg-white py-1 shadow-lg dark:border-earth-700 dark:bg-earth-900">
            <template x-if="!creating">
              <div>
                <template x-for="cat in categories" :key="cat.id">
                  <button type="button" @click="select(cat)"
                          class="flex w-full items-center gap-2 px-4 py-2 text-sm text-earth-900 hover:bg-earth-50 dark:text-earth-200 dark:hover:bg-earth-800">
                    <i :data-lucide="cat.icon" class="lucide-sm"></i>
                    <span x-text="cat.name"></span>
                  </button>
                </template>
                <button x-show="canCreate" type="button" @click="creating = true; $nextTick(() => positionDropdown($refs.dropdownBtn))"
                        class="flex w-full items-center gap-2 border-t border-earth-200 px-4 py-2 text-sm font-medium text-clay-600 hover:bg-earth-50 dark:border-earth-700 dark:text-clay-400 dark:hover:bg-earth-800">
                  <i data-lucide="plus" class="lucide-sm"></i>
                  Nueva categoría
                </button>
              </div>
            </template>
            <template x-if="creating">
              <div class="space-y-1.5 p-2">
                <p class="text-sm font-semibold text-earth-800 dark:text-earth-200">Nueva categoría</p>
                <input type="text" x-model="newName" maxlength="100" placeholder="Nombre de la categoría"
                       class="w-full rounded-lg border border-earth-300 bg-white px-3 py-1.5 text-sm text-earth-900 placeholder-earth-400 focus:border-clay-400 focus:outline-none focus:ring-2 focus:ring-clay-400/20 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-200 dark:placeholder-earth-500">
                <div>
                  <p class="mb-0.5 text-xs font-medium text-earth-500 dark:text-earth-400">Ícono</p>
                  <div class="grid max-h-16 grid-cols-8 gap-1 overflow-y-auto rounded-lg border border-earth-200 bg-white p-1 dark:border-earth-700 dark:bg-earth-800">
                    <template x-for="ic in icons" :key="ic">
                      <button type="button" @click="newIcon = ic"
                              :class="newIcon === ic ? 'border-clay-400 bg-clay-50 text-clay-700 dark:bg-clay-900/40 dark:text-clay-300' : 'border-transparent text-gray-500 hover:bg-earth-50 dark:text-gray-400 dark:hover:bg-earth-700'"
                              class="flex items-center justify-center rounded-lg border p-1">
                        <i :data-lucide="ic" class="lucide-sm"></i>
                      </button>
                    </template>
                  </div>
                </div>
                <div>
                  <p class="mb-0.5 text-xs font-medium text-earth-500 dark:text-earth-400">Color</p>
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="col in colors" :key="col">
                      <button type="button" @click="newColor = col"
                              :class="newColor === col ? 'ring-2 ring-offset-2 ring-clay-400 dark:ring-offset-earth-900' : ''"
                              class="h-6 w-6 rounded-full border border-earth-200"
                              :style="'background-color: ' + col"></button>
                    </template>
                  </div>
                </div>
                <div class="flex gap-2">
                  <button type="button" @click="creating = false; $nextTick(() => positionDropdown($refs.dropdownBtn))"
                          class="flex-1 rounded-lg border border-earth-300 px-3 py-1.5 text-sm font-medium text-earth-600 hover:bg-earth-50 dark:border-earth-700 dark:text-earth-400 dark:hover:bg-earth-800">Cancelar</button>
                  <button type="button" @click="submitNew()" :disabled="!newName.trim()"
                          class="flex-1 rounded-lg bg-clay-500 px-3 py-1.5 text-sm font-semibold text-white hover:bg-clay-600 disabled:opacity-50 touch-target">Crear</button>
                </div>
              </div>
            </template>
          </div>
        </div>
        <input type="hidden" name="category" id="quick_category" value="" required>
      </div>

      <!-- Date -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-earth-700 dark:text-earth-300">Fecha</label>
        <input type="date" name="date" x-model="date"
               class="w-full rounded-lg border border-earth-300 bg-white px-4 py-3 text-base text-earth-900 focus:border-clay-400 focus:outline-none focus:ring-2 focus:ring-clay-400/20 dark:border-earth-700 dark:bg-earth-800 dark:text-earth-200 sm:text-sm sm:py-2.5">
      </div>

      <input type="hidden" name="note" id="quick_note" value="">

      <!-- Submit -->
      <button type="submit" :disabled="submitting"
              class="w-full inline-flex items-center justify-center gap-1.5 rounded-lg bg-clay-500 px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all hover:bg-clay-600 disabled:opacity-50 disabled:cursor-not-allowed touch-target">
        <i x-show="!submitting" data-lucide="check" class="lucide-sm"></i>
        <span x-show="submitting" class="lucide-sm animate-spin">⟳</span>
        <span x-text="submitting ? 'Guardando...' : 'Guardar'"></span>
      </button>
    </form>
  </div>
  </div>
</div>

<script>
function quickAddModal() {
  const today = new Date().toISOString().split('T')[0];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  return {
    open: false,
    type: 'EXPENSE',
    amount: '',
    date: today,
    nlText: '',
    nlOpen: false,
    listening: false,
    speechSupported: !!SR,
    recognition: null,
    micStatus: '',
    micError: '',
    submitting: false,
    onOpen(evt) {
      this.open = true;
      if (evt && evt.detail && evt.detail.listen) {
        this.nlOpen = true;
        this.toggleListen();
      }
    },
    async applyNl() {
      const field = document.getElementById('quick-category-field');
      const dd = field ? Alpine.$data(field) : null;
      const base = window.nlParse(this.nlText || '', []);
      if (!base) return;
      if (base.amount) this.amount = base.amount;
      if (base.type) this.type = base.type;
      if (base.date) this.date = base.date;
      const noteEl = document.getElementById('quick_note');
      if (noteEl) noteEl.value = base.note || '';
      if (dd) {
        dd.type = this.type;
        await Promise.resolve(dd.loadCategories(this.type));
        const res = window.nlParse(this.nlText || '', dd.categories);
        if (res && res.categoryName) {
          const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          const cat = dd.categories.find(c => norm(c.name) === norm(res.categoryName));
          if (cat) dd.select(cat);
        }
      }
    },
    async requestMic() {
      this.micStatus = '';
      this.micError = '';
      if (!window.isSecureContext) {
        this.micError = 'El micrófono necesita HTTPS o localhost. Estás en una conexión no segura.';
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        this.micError = 'Este navegador no permite acceder al micrófono.';
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        return true;
      } catch (e) {
        const name = (e && e.name) || 'Error';
        const msgs = {
          NotAllowedError: 'Permiso de micrófono denegado. Habilitalo en el navegador y reintentá.',
          NotFoundError: 'No se encontró ningún micrófono.',
          NotReadableError: 'El micrófono está en uso por otra app.',
          SecurityError: 'Bloqueado por seguridad. Probá desde HTTPS.',
          AbortError: 'No se pudo iniciar el micrófono.'
        };
        this.micError = msgs[name] || ('No se pudo acceder al micrófono (' + name + ').');
        return false;
      }
    },
    async toggleListen() {
      if (this.listening) { this.stopListening(); return; }
      const ok = await this.requestMic();
      if (!ok) return;
      if (!this.speechSupported) {
        this.micError = 'Tu navegador no soporta dictado nativo; usá el micrófono del teclado.';
        return;
      }
      const rec = new SR();
      rec.lang = 'es-AR';
      rec.interimResults = true;
      rec.continuous = false;
      let finalText = '';
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += t; else interim += t;
        }
        this.nlText = (finalText + interim).trim();
      };
      rec.onend = () => { this.listening = false; this.micStatus = ''; this.applyNl(); };
      rec.onerror = (e) => {
        this.listening = false;
        this.micStatus = '';
        const codes = {
          'not-allowed': 'Permiso de micrófono denegado.',
          'service-not-allowed': 'El servicio de dictado no está permitido.',
          'no-speech': 'No se escuchó nada. Reintentá.',
          'audio-capture': 'No hay micrófono disponible.',
          'network': 'Sin conexión para el dictado.'
        };
        this.micError = codes[e && e.error] || 'Error de dictado.';
      };
      this.recognition = rec;
      this.listening = true;
      this.micStatus = 'Escuchando…';
      try { rec.start(); } catch (e) { this.listening = false; this.micStatus = ''; this.micError = 'No se pudo iniciar el dictado.'; }
    },
    stopListening() {
      try { if (this.recognition) this.recognition.stop(); } catch (e) {}
      this.listening = false;
      this.micStatus = '';
    },
    handleResponse(evt) {
      this.submitting = false;
      if (evt.detail.successful) {
        window.location.reload();
      }
    }
  };
}

function quickCategoryDropdown() {
  const ICONS = ['wallet','banknote','credit-card','coins','shopping-cart','shopping-bag','pizza','coffee','utensils','salad','bus','car','train','home','building','lightbulb','heart-pulse','graduation-cap','film','music','gamepad-2','shirt','laptop','smartphone','paw-print','plane','dumbbell','gift','briefcase','trending-up','piggy-bank','scale','receipt-text','stethoscope','wrench','sparkles','star','package','wifi','heart','calculator','cloud'];
  const COLORS = ['#6E4E38','#A07858','#C4943A','#D4A857','#8BA864','#6E8F4C','#D4764A','#C16645','#7A3F23','#8A6348','#485D35','#5A753F'];
  return {
    open: false,
    creating: false,
    canCreate: true,
    type: 'EXPENSE',
    newName: '',
    newIcon: 'package',
    newColor: '#A07858',
    icons: ICONS,
    colors: COLORS,
    selectedId: '',
    selectedName: 'Seleccionar categoria',
    selectedIcon: '',
    categories: [],
    dropdownStyle: '',
    init() {
      this.$watch('creating', (val) => {
        if (val) {
          this.$nextTick(() => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
          });
        }
      });
    },
    positionDropdown(btn) {
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const list = this.$refs.dropdownList;
      const listHeight = list ? list.scrollHeight : 240;
      const style = `left:${rect.left}px; width:${rect.width}px;`;
      if (spaceBelow < listHeight + 8) {
        this.dropdownStyle = `${style} bottom:${window.innerHeight - rect.top}px; max-height:${Math.min(listHeight, spaceBelow)}px;`;
      } else {
        this.dropdownStyle = `${style} top:${rect.bottom + 4}px;`;
      }
    },
    loadCategories(type) {
      type = type || 'EXPENSE';
      return fetch(`/transactions/category-options/?type=${type}`)
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          this.canCreate = temp.querySelector('select')?.dataset.canCreate === 'true';
          const options = temp.querySelectorAll('option');
          this.categories = Array.from(options).map(opt => ({
            id: opt.value,
            name: opt.textContent.trim(),
            icon: opt.dataset.icon || ''
          })).filter(c => c.id);
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        });
    },
    submitNew() {
      const name = this.newName.trim();
      if (!name) return;
      const body = new URLSearchParams();
      body.append('name', name);
      body.append('type', this.type || 'EXPENSE');
      body.append('icon', this.newIcon);
      body.append('color', this.newColor);
      const csrf = document.querySelector('input[name="csrfmiddlewaretoken"]')?.value || '';
      fetch('/categories/add/', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrf, 'HX-Request': 'true' },
        body
      })
        .then(r => r.text())
        .then(html => {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          const options = temp.querySelectorAll('option');
          this.categories = Array.from(options).map(opt => ({
            id: opt.value,
            name: opt.textContent.trim(),
            icon: opt.dataset.icon || ''
          })).filter(c => c.id);
          const created = this.categories.find(c => c.name.toLowerCase() === name.toLowerCase());
          if (created) {
            this.selectedId = created.id;
            this.selectedName = created.name;
            this.selectedIcon = created.icon;
            document.getElementById('quick_category').value = created.id;
          }
          this.creating = false;
          this.open = false;
          this.newName = '';
          this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        });
    },
    select(cat) {
      this.selectedId = cat.id;
      this.selectedName = cat.name;
      this.selectedIcon = cat.icon;
      this.open = false;
      document.getElementById('quick_category').value = cat.id;
      this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
    },
    toggle() { this.open = !this.open; }
  };
}
</script>
