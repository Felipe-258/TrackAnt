<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin conexion — TrackAnt</title>
  <meta name="theme-color" content="#A07858" id="theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrackAnt">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    :root {
      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-top: calc(var(--safe-top) + 2rem);
      padding-bottom: calc(var(--safe-bottom) + 2rem);
      text-align: center;
      background: #FAF6F1;
      color: #3A271B;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1F1410;
        color: #E2D1BC;
      }
      .ant-icon { opacity: 0.3; }
      .btn {
        background: #8A6348;
        color: #FAF6F1;
      }
      .btn:hover { background: #6E4E38; }
    }
    .ant-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      max-width: 20rem;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      background: #8A6348;
      color: #FAF6F1;
      transition: background 0.15s, transform 0.05s;
      min-height: 44px;
      min-width: 44px;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 1em; height: 1em; }
    .brand {
      font-size: 0.75rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <h1>Sin conexion</h1>
  <p>No pudimos conectar con el servidor. Verifica tu conexion a internet y volve a intentarlo.</p>

  <button class="btn" onclick="window.location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
    Reintentar
  </button>

  <p class="brand">TrackAnt — Tus finanzas, tu colonia</p>

  <script>
    var isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark === null) {
      isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    if (isDark) {
      document.documentElement.classList.add('dark');
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta && isDark) {
      meta.setAttribute('content', '#3A271B');
    }
  </script>
</body>
</html>
