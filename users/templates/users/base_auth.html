{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}TrackAnt{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if (localStorage.getItem('darkMode') === 'true') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        extend: {
          colors: {
            earth: {50:'#FAF6F1',100:'#F2EBE0',200:'#E2D1BC',300:'#CEB496',400:'#B89472',500:'#A07858',600:'#8A6348',700:'#6E4E38',800:'#543B29',900:'#3A271B',950:'#1F1410'},
            clay:  {50:'#FDF4EE',100:'#FAE5D7',200:'#F4C8AA',300:'#ECA776',400:'#E4864C',500:'#D4764A',600:'#C16645',700:'#A0522D',800:'#7A3F23',900:'#5C2E19',950:'#32170D'},
            sage:  {50:'#F4F7F0',100:'#E4EDD8',200:'#C9D9B2',300:'#AAC288',400:'#8BA864',500:'#6E8F4C',600:'#5A753F',700:'#485D35',800:'#3A4A2C',900:'#2E3D23',950:'#182110'},
            gold:  {50:'#FDF8EE',100:'#F9EDD0',200:'#F2D99F',300:'#E9C06A',400:'#D4A857',500:'#C4943A',600:'#A1752E',700:'#7D5A27',800:'#654A24',900:'#523D21',950:'#2E210F'},
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/colony/ant.svg' %}">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    [data-lucide] { display: inline-block; width: 1em; height: 1em; stroke-width: 1.5; }
    .lucide { width: 1.25em; height: 1.25em; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .float { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="h-full bg-earth-50 dark:bg-earth-950">
  <div class="flex min-h-screen flex-col items-center justify-center px-4">
    <div class="w-full max-w-md text-center">
      <div class="mb-8">
        <span class="inline-flex h-24 w-24 items-center justify-center rounded-3xl bg-clay-100 shadow-lg float dark:bg-clay-900/50"><img src="{% static 'icons/colony/ant.svg' %}" class="h-16 w-16" alt="hormiga"></span>
      </div>
      <h1 class="mb-2 text-4xl font-bold text-earth-900 dark:text-earth-100">{% block heading %}TrackAnt{% endblock %}</h1>
      <p class="mb-10 text-lg text-earth-500 dark:text-earth-400">{% block subheading %}Tus finanzas, tu colonia{% endblock %}</p>

      {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div class="rounded-lg border px-4 py-3 text-sm font-medium animate-fade-in
                    {% if message.tags == 'success' %}border-sage-300 bg-sage-50 text-sage-800 dark:border-sage-700 dark:bg-sage-900/30 dark:text-sage-300
                    {% elif message.tags == 'error' %}border-clay-300 bg-clay-50 text-clay-800 dark:border-clay-700 dark:bg-clay-900/30 dark:text-clay-300
                    {% elif message.tags == 'warning' %}border-gold-300 bg-gold-50 text-gold-800 dark:border-gold-700 dark:bg-gold-900/30 dark:text-gold-300
                    {% else %}border-earth-300 bg-earth-50 text-earth-800 dark:border-earth-700 dark:bg-earth-900/30 dark:text-earth-300{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
