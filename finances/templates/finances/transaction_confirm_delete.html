{% extends 'base.html' %}
{% block title %}Eliminar transacción - TrackAnt{% endblock %}
{% block page_title %}Eliminar transacción{% endblock %}

{% block content %}
<div class="mx-auto max-w-md text-center">
  <div class="rounded-xl border border-earth-200 bg-white p-6 shadow-sm dark:border-earth-800 dark:bg-earth-900">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-clay-100 dark:bg-clay-900/50">
      <i data-lucide="alert-triangle" class="lucide-lg text-clay-600 dark:text-clay-400"></i>
    </div>
    <h2 class="mt-4 text-lg font-semibold text-earth-900 dark:text-earth-100">¿Estás seguro?</h2>
    <p class="mt-1 text-sm text-earth-500 dark:text-earth-400">Esta acción no se puede deshacer.</p>
    <form method="post" class="mt-6 flex justify-center gap-3">
      {% csrf_token %}
      <a href="{% url 'finances:transaction_list' %}" class="rounded-lg border border-earth-300 px-4 py-2 text-sm font-medium text-earth-600 hover:bg-earth-50 dark:border-earth-700 dark:text-earth-400 dark:hover:bg-earth-800">Cancelar</a>
      <button type="submit" class="rounded-lg bg-clay-500 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-clay-600">Eliminar</button>
    </form>
  </div>
</div>
{% endblock %}
