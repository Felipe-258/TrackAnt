{% for tag in tags %}
<button type="button"
        class="tag-option flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-earth-700 hover:bg-earth-100 dark:text-earth-300 dark:hover:bg-earth-800"
        data-tag-id="{{ tag.id }}"
        data-tag-name="{{ tag.name }}">
  <span class="flex h-6 w-6 items-center justify-center rounded" style="background-color: {{ tag.color }}20; color: {{ tag.color }}">#</span>
  {{ tag.name }}
</button>
{% empty %}
{% if query %}
<p class="px-3 py-2 text-sm text-earth-400 italic">➕ Crear tag libre: "{{ query }}"</p>
{% endif %}
{% endfor %}
