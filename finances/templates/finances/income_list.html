{% extends 'base.html' %}
{% block title %}Ingresos - TrackAnt{% endblock %}
{% block page_title %}Ingresos{% endblock %}
{% block page_subtitle %}Tus entradas de dinero{% endblock %}

{% block content %}
<div class="rounded-xl border border-earth-200 bg-white shadow-sm dark:border-earth-800 dark:bg-earth-900">
  <div class="flex items-center justify-between border-b border-earth-200 px-6 py-4 dark:border-earth-800">
    <h2 class="text-base font-semibold text-earth-900 dark:text-earth-100">Ingresos</h2>
    <a href="{% url 'finances:transaction_add' %}"
       class="inline-flex items-center gap-1.5 rounded-lg bg-sage-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-sage-700">
      <i data-lucide="plus" class="lucide-sm"></i>
      <span class="hidden sm:inline">Nuevo </span>Ingreso
    </a>
  </div>
  <div class="flex flex-col items-center px-6 py-16 text-center">
    <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-sage-100 dark:bg-sage-900/50">
      <i data-lucide="trending-up" class="lucide text-sage-500"></i>
    </div>
    <p class="text-sm text-earth-500 dark:text-earth-400">No hay ingresos registrados.</p>
    <a href="{% url 'finances:transaction_add' %}" class="mt-2 text-sm font-medium text-sage-600 hover:text-sage-700 dark:text-sage-400">+ Agregar ingreso</a>
  </div>
</div>
{% endblock %}
